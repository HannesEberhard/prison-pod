operator:
  # Must be pinned by digest: <image>@sha256:<digest>
  image: ""
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

sandbox:
  # Image for every sandbox pod (clone init containers, agent, ssh). Must be pinned by digest.
  image: ""
  # StorageClass for each sandbox's PVC (workspace + home). Empty: the cluster's default class.
  storageClass: ""
  # Size of each sandbox's PVC. Applies to new sandboxes only.
  storageSize: 5Gi
  # The agent container, where Claude and everything it starts runs.
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi
  # RuntimeClass for sandbox pods, e.g. gvisor. Empty: the cluster's default runtime.
  runtimeClassName: ""
  # Reachable on 443 from every sandbox: what Claude Code Remote Control needs. Each sandbox
  # can also reach its repo hosts and whatever its spec.egress allows; nothing else.
  essentialHosts:
    - api.anthropic.com
    - claude.ai
    - claude.com
    - platform.claude.com
