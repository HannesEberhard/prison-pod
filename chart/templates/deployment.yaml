apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-operator
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1  # kopf --standalone: never run more than one
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}-operator
    spec:
      serviceAccountName: {{ .Release.Name }}-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: {{ include "prison-pod.pinnedImage" (dict "name" "operator.image" "ref" .Values.operator.image) }}
          env:
            - name: AGENT_IMAGE
              value: {{ include "prison-pod.pinnedImage" (dict "name" "sandbox.image" "ref" .Values.sandbox.image) | quote }}
            - name: STORAGE_CLASS
              value: {{ .Values.sandbox.storageClass | default "" | quote }}
          resources:
            {{- toYaml .Values.operator.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
