apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: prisonpods.prisonpod.fdr2026.dev
  annotations:
    # A template (not crds/) so that upgrades update it; kept on uninstall, because deleting
    # it would delete every PrisonPod and, through garbage collection, its PVC.
    helm.sh/resource-policy: keep
spec:
  group: prisonpod.fdr2026.dev
  scope: Namespaced
  names:
    kind: PrisonPod
    plural: prisonpods
    singular: prisonpod
    shortNames: [pp]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: Reason
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].reason
        - name: Repos
          type: string
          jsonPath: .status.repos
        - name: Session
          type: string
          jsonPath: .status.sessionURL
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          x-kubernetes-validations:
            - rule: self.metadata.name.size() <= 52
              message: name must be at most 52 characters (prefixed with prison-pod- in resource names)
          properties:
            spec:
              type: object
              required: [repos, credentialsSecretRef, git]
              properties:
                repos:
                  type: array
                  description: >-
                    Repositories cloned side by side into /data/workspace/<name>. Entries can be added
                    and removed; a removed repo's directory stays on the volume.
                  minItems: 1
                  maxItems: 10
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [name]
                  items:
                    type: object
                    required: [name, url]
                    x-kubernetes-validations:
                      - rule: self == oldSelf
                        message: repo entries are immutable; add the repo under a new name instead
                    properties:
                      name:
                        type: string
                        description: Directory under /data/workspace; also part of the clone init container's name.
                        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                        maxLength: 57
                      url:
                        type: string
                        pattern: '^https://'
                      ref:
                        type: string
                        description: Branch or tag. Defaults to the remote's default branch.
                credentialsSecretRef:
                  type: object
                  required: [name]
                  description: >-
                    Secret in the same namespace with keys `.credentials.json` (~/.claude/.credentials.json)
                    and `oauthAccount.json` (the oauthAccount object from ~/.claude.json) after `claude auth login`.
                    Immutable: it is copied onto the volume once.
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: credentialsSecretRef is immutable
                  properties:
                    name:
                      type: string
                gitCredentialsSecretRef:
                  type: object
                  required: [name]
                  description: >-
                    Optional Secret in the same namespace for private repos. Key `token` (required) is an
                    access token sent over https as the password; `username` defaults to x-access-token
                    (GitHub); `host` defaults to github.com and is the only host the token is sent to.
                    Available to clones, to Claude and to SSH sessions, so use a scoped, revocable token.
                  properties:
                    name:
                      type: string
                ssh:
                  type: object
                  description: Adds an `ssh` sidecar (sshd on 127.0.0.1:2222, reached via kubectl; see README).
                  properties:
                    authorizedKeys:
                      type: array
                      minItems: 1
                      maxItems: 20
                      items:
                        type: string
                        description: One public key line. authorized_keys options (e.g. command=) are rejected.
                        pattern: '^(ssh-ed25519|ssh-rsa|ecdsa-sha2-nistp(256|384|521)|sk-ssh-ed25519@openssh\.com|sk-ecdsa-sha2-nistp256@openssh\.com) [A-Za-z0-9+/]+={0,2}( [^\n]*)?$'
                git:
                  type: object
                  description: Git identity for commits in the sandbox (git config --global user.name / user.email).
                  required: [name, email]
                  properties:
                    name:
                      type: string
                      minLength: 1
                    email:
                      type: string
                      minLength: 1
                egress:
                  type: array
                  description: >-
                    Hosts the sandbox may connect to, besides the repo hosts and the chart's essential hosts
                    (Claude). Everything else is blocked.
                  maxItems: 50
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [host]
                  items:
                    type: object
                    required: [host]
                    properties:
                      host:
                        type: string
                        description: A hostname, or *.domain for its direct subdomains (one level, not domain itself).
                        maxLength: 253
                        pattern: '^(\*\.)?([a-z0-9]([-a-z0-9]*[a-z0-9])?\.)+[a-z]([-a-z0-9]*[a-z0-9])?$'
                      ports:
                        type: array
                        description: TCP ports. Defaults to 443.
                        minItems: 1
                        maxItems: 10
                        x-kubernetes-list-type: set
                        items:
                          type: integer
                          minimum: 1
                          maximum: 65535
                permissionMode:
                  type: string
                  enum: [default, acceptEdits, auto, bypassPermissions, dontAsk, plan]
                  default: auto
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [type, status]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                sessionURL:
                  type: string
                  description: The Remote Control session on claude.ai, once the agent has registered it.
                repos:
                  type: string
                  description: Comma-separated repo names, for the Repos printer column.
